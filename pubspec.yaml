name: bolt_inspection
description: Bolt Inspection & Training — company website + admin panel (Flutter Web)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  cloud_firestore: ^6.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# firebase_core 4.14.0 pulls in firebase_core_web ^3.11.0, but 3.11.0 has a
# regression (#18552) that calls `e.isA<JSObject>()` on a caught `Object`,
# which doesn't compile on Dart 3.10.x (`isA` is defined on `JSAny?`, not
# `Object`). Pin the last good web impl (3.10.0) until upstream ships a fix.
dependency_overrides:
  firebase_core_web: 3.10.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/images/
    - assets/certifications/
